<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" width="400" height="860" role="img" aria-labelledby="t d">
  <title id="t">The spec-driven loop used on Pauper Pilot</title>
  <desc id="d">A roadmap entry goes through explore, propose, human review, apply and archive. Explore, propose and review are where the product gets defined; review can send a proposal back for another iteration. Archiving merges the specs into the source of truth, and surprises found while implementing become project rules in CLAUDE.md. Both feed the context of the next change.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98A2AC"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C6F432"/>
    </marker>
    <style>
      .bg { fill: #0B0D10; }
      .box { fill: #14181D; stroke: #2A3038; stroke-width: 1.5; }
      .key { fill: #14181D; stroke: #C6F432; stroke-width: 2; }
      .h { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 18px; fill: #F4F6F8; }
      .s { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #C5CCD3; }
      .m { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 13px; fill: #C5CCD3; }
      .mh { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 14px; font-weight: 700; fill: #F4F6F8; }
      .lbl { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 12px; fill: #98A2AC; }
      .acc { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 12px; fill: #C6F432; }
      .ln { fill: none; stroke: #98A2AC; stroke-width: 1.5; }
      .dash { fill: none; stroke: #98A2AC; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .bracket { fill: none; stroke: #C6F432; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="400" height="860"/>

  <!-- Steps -->
  <rect class="box" x="44" y="20" width="236" height="104"/>
  <text class="h" x="60" y="48">Roadmap entry</text>
  <text class="s" x="60" y="72">Objective · Scope</text>
  <text class="s" x="60" y="92">Acceptance criteria</text>
  <text class="s" x="60" y="112" style="fill:#C6F432">Open questions</text>

  <rect class="box" x="44" y="164" width="236" height="76"/>
  <text class="h" x="60" y="192">Explore</text>
  <text class="s" x="60" y="216">Talk it through, measure</text>
  <text class="s" x="60" y="232">real data, compare options</text>

  <rect class="box" x="44" y="272" width="236" height="76"/>
  <text class="h" x="60" y="300">Propose</text>
  <text class="m" x="60" y="324">proposal.md · delta specs</text>
  <text class="m" x="60" y="340">design.md</text>

  <rect class="key" x="44" y="380" width="236" height="76"/>
  <text class="h" x="60" y="408">Review</text>
  <text class="s" x="60" y="432">Human decision on the</text>
  <text class="s" x="60" y="448">open questions</text>

  <rect class="box" x="44" y="488" width="236" height="76"/>
  <text class="h" x="60" y="516">Apply</text>
  <text class="s" x="60" y="540">Agent implements,</text>
  <text class="s" x="60" y="556">tests and checks</text>

  <rect class="box" x="44" y="596" width="236" height="76"/>
  <text class="h" x="60" y="624">Archive</text>
  <text class="s" x="60" y="648">Specs merged, entry</text>
  <text class="s" x="60" y="664">leaves the roadmap</text>

  <!-- Main flow -->
  <path class="ln" d="M162 124 V162" marker-end="url(#a)"/>
  <path class="ln" d="M162 240 V270" marker-end="url(#a)"/>
  <path class="ln" d="M162 348 V378" marker-end="url(#a)"/>
  <path class="ln" d="M162 456 V486" marker-end="url(#aa)" style="stroke:#C6F432"/>
  <path class="ln" d="M162 564 V594" marker-end="url(#a)"/>

  <!-- Definition phase -->
  <path class="bracket" d="M290 164 H300 V456 H290"/>
  <text class="acc" transform="translate(318 310) rotate(90)" text-anchor="middle">WHERE THE PRODUCT GETS DEFINED</text>

  <!-- Iterate loop -->
  <path class="ln" d="M44 418 H28 V310 H42" marker-end="url(#a)"/>
  <text class="lbl" transform="translate(20 364) rotate(-90)" text-anchor="middle">iterate</text>

  <!-- Into the stores -->
  <path class="dash" d="M44 526 H28 V700 H105 V718" marker-end="url(#a)"/>
  <text class="lbl" transform="translate(20 618) rotate(-90)" text-anchor="middle">surprises → rules</text>
  <path class="ln" d="M220 672 V700 H295 V718" marker-end="url(#a)"/>

  <!-- Stores -->
  <rect class="box" x="20" y="720" width="170" height="84"/>
  <text class="mh" x="34" y="746">CLAUDE.md</text>
  <text class="s" x="34" y="770">Project rules learned</text>
  <text class="s" x="34" y="788">along the way</text>

  <rect class="box" x="206" y="720" width="174" height="84"/>
  <text class="mh" x="220" y="746">openspec/specs/</text>
  <text class="s" x="220" y="770">Source of truth: what</text>
  <text class="s" x="220" y="788">the system does</text>

  <!-- Feedback into the next change -->
  <path class="ln" d="M105 804 V826 H295"/>
  <path class="ln" d="M295 804 V826 H388 V144 H230 V162" marker-end="url(#a)"/>
  <text class="lbl" x="20" y="848">context for the next change</text>
</svg>
